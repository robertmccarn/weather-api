<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f7;color:#172033}
header{padding:18px 24px;background:#172033;color:white}
header h1{margin:0 0 4px} header p{margin:0;color:#cbd5e1}
main{display:grid;grid-template-columns:minmax(0,2fr) minmax(360px,1fr);gap:16px;height:calc(100vh - 91px);padding:16px;max-width:1600px;margin:auto}
.map-wrap{position:relative;min-height:0}
#map{height:100%;min-height:500px;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.map-controls{position:absolute;z-index:1000;top:12px;left:12px;right:12px;display:flex;gap:8px;max-width:650px}
.search-box{flex:1;display:flex;background:white;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:hidden}
.search-box input{min-width:0;flex:1;border:0;padding:11px 12px;font-size:14px;outline:none}
button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;background:white;color:#172033;box-shadow:0 2px 8px rgba(0,0,0,.18);font-weight:600}
button:hover{background:#f1f5f9}
.search-box button{border-radius:0;box-shadow:none;border-left:1px solid #e5e7eb}
.search-results{position:absolute;top:50px;left:0;width:min(500px,calc(100% - 100px));background:white;border-radius:8px;box-shadow:0 3px 12px rgba(0,0,0,.2);overflow:hidden;display:none}
.search-result{padding:10px 12px;border-bottom:1px solid #e5e7eb;cursor:pointer;font-size:14px}
.search-result:hover{background:#f8fafc}
.panel{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.10);min-height:0;overflow:hidden;display:flex;flex-direction:column}
.location-title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#location{margin:0;font-size:25px}
#coordinates{color:#64748b;font-size:12px;margin-top:3px}
#status{color:#64748b;font-size:13px;margin:7px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{box-shadow:none;border:1px solid #dbe2ea;padding:8px 12px}
.tabs button.active{background:#172033;color:white;border-color:#172033}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.metric{background:#f8fafc;border-radius:8px;padding:10px}
.metric-label{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.metric-value{font-size:18px;font-weight:700;margin-top:3px}
#chart-wrap{height:150px;margin-bottom:8px}
#forecast{min-height:0;overflow-y:auto;padding-right:4px}
.day-header{font-weight:750;margin:15px 0 6px;color:#172033}
.hour{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #edf0f3}
.weather-icon{font-size:23px}.hour-time{font-weight:650;font-size:13px}.hour-detail{color:#64748b;font-size:12px}.hour-temp{font-size:18px;font-weight:700}
.daily{display:grid;gap:8px}.daily-card{display:grid;grid-template-columns:72px 42px 1fr auto;align-items:center;gap:8px;padding:11px 6px;border-bottom:1px solid #edf0f3}
.daily-date{font-weight:700}.daily-range{font-weight:700}.daily-detail{color:#64748b;font-size:12px}
.radar-credit{position:absolute;z-index:1000;bottom:4px;right:4px;background:rgba(255,255,255,.85);padding:2px 5px;font-size:10px;display:none}
@media(max-width:900px){header{padding:14px 16px}main{display:flex;flex-direction:column;height:auto;padding:10px}#map{height:55vh;min-height:400px}.panel{max-height:70vh}.map-controls{flex-wrap:wrap}}
</style>
</head>
<body>
<header><h1>Weather Map</h1><p>Click the map, search for a place, or use your current location.</p></header>
<main>
<div class="map-wrap">
<div id="map"></div>
<div class="map-controls">
<div class="search-box"><input id="search-input" type="search" placeholder="Search a city or place..."><button id="search-button">Search</button></div>
<button id="locate-button" title="Use my location">My location</button>
<button id="radar-button" title="Toggle radar">Radar</button>
<div id="search-results" class="search-results"></div>
</div>
<div id="radar-credit" class="radar-credit">Weather radar by RainViewer</div>
</div>
<section class="panel">
<div class="location-title"><div><h2 id="location">Spring, TX</h2><div id="coordinates">30.0799, -95.4172</div></div></div>
<div id="status">Loading forecast...</div>
<div class="summary">
<div class="metric"><div class="metric-label">Now</div><div class="metric-value" id="current-temp">--</div></div>
<div class="metric"><div class="metric-label">Feels like</div><div class="metric-value" id="feels-like">--</div></div>
<div class="metric"><div class="metric-label">Conditions</div><div class="metric-value" id="current-condition">--</div></div>
</div>
<div class="tabs"><button id="daily-tab" class="active">7-Day</button><button id="hourly-tab">Hourly</button></div>
<div id="chart-wrap"><canvas id="temperature-chart"></canvas></div>
<div id="forecast"></div>
</section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
<script>
const map=L.map("map").setView([30.0799,-95.4172],8);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
let marker=L.marker([30.0799,-95.4172]).addTo(map);
let radarLayer=null,currentForecast=null,currentView="daily",temperatureChart=null;
const weatherDescriptions={0:["Clear sky","☀️"],1:["Mainly clear","🌤️"],2:["Partly cloudy","⛅"],3:["Overcast","☁️"],45:["Fog","🌫️"],48:["Rime fog","🌫️"],51:["Light drizzle","🌦️"],53:["Drizzle","🌦️"],55:["Heavy drizzle","🌧️"],61:["Light rain","🌦️"],63:["Rain","🌧️"],65:["Heavy rain","🌧️"],71:["Light snow","🌨️"],73:["Snow","❄️"],75:["Heavy snow","❄️"],80:["Light showers","🌦️"],81:["Showers","🌧️"],82:["Heavy showers","⛈️"],95:["Thunderstorm","⛈️"],96:["Thunderstorm with hail","⛈️"],99:["Severe thunderstorm","⛈️"]};
function weatherInfo(code){return weatherDescriptions[code]||["Unknown","🌡️"];}
function direction(degrees){if(degrees===null||degrees===undefined)return"--";const d=["N","NE","E","SE","S","SW","W","NW"];return d[Math.round(degrees/45)%8];}
function formatDay(s){return new Date(s+"T12:00:00").toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"});}
function formatHour(s){return new Date(s).toLocaleTimeString([],{hour:"numeric"});}
async function reverseGeocode(lat,lon){try{const r=await fetch("/api/geocode/reverse?latitude="+lat+"&longitude="+lon);if(!r.ok)throw 0;const d=await r.json(),a=d.address||{};const city=a.city||a.town||a.village||a.municipality||a.county||"Selected location";return a.state?city+", "+a.state:city;}catch{return lat.toFixed(4)+", "+lon.toFixed(4);}}
async function loadForecast(lat,lon,locationName=null){
const status=document.getElementById("status"),forecast=document.getElementById("forecast");
status.textContent="Loading forecast...";forecast.innerHTML="";
try{
const r=await fetch("/api/forecast?latitude="+lat+"&longitude="+lon);if(!r.ok)throw 0;
currentForecast=await r.json();const name=locationName||await reverseGeocode(lat,lon);
document.getElementById("location").textContent=name;document.getElementById("coordinates").textContent=lat.toFixed(4)+", "+lon.toFixed(4);
status.textContent="Forecast for "+(currentForecast.timezone||"local time");
const current=currentForecast.hourly[0],info=weatherInfo(current.weather_code);
document.getElementById("current-temp").textContent=Math.round(current.temperature)+"°";
document.getElementById("feels-like").textContent=Math.round(current.apparent_temperature)+"°";
document.getElementById("current-condition").textContent=info[1]+" "+info[0];
marker.bindPopup("<strong>"+name+"</strong><br>"+Math.round(current.temperature)+"°F | "+info[0]).openPopup();
renderChart();renderForecast();
}catch{status.textContent="Unable to load forecast.";forecast.innerHTML="";}}
function renderForecast(){
if(!currentForecast)return;const forecast=document.getElementById("forecast");forecast.innerHTML="";
if(currentView==="daily"){
const wrapper=document.createElement("div");wrapper.className="daily";
currentForecast.daily.forEach((day,i)=>{const info=weatherInfo(day.weather_code),card=document.createElement("div");card.className="daily-card";
const date=i===0?"Today":i===1?"Tomorrow":formatDay(day.date);
card.innerHTML="<div class='daily-date'>"+date+"</div><div class='weather-icon'>"+info[1]+"</div><div><strong>"+info[0]+"</strong><div class='daily-detail'>Rain "+day.precipitation_probability+"% · UV "+day.uv_index_max.toFixed(0)+" · Wind "+Math.round(day.wind_speed_max)+" mph "+direction(day.wind_direction)+"</div></div><div class='daily-range'>"+Math.round(day.temperature_max)+"° / "+Math.round(day.temperature_min)+"°</div>";
wrapper.appendChild(card);});forecast.appendChild(wrapper);return;}
let previousDate=null;
currentForecast.hourly.forEach(hour=>{const key=hour.time.slice(0,10);if(key!==previousDate){const h=document.createElement("div");h.className="day-header";h.textContent=formatDay(key);forecast.appendChild(h);previousDate=key;}
const info=weatherInfo(hour.weather_code),row=document.createElement("div");row.className="hour";
row.innerHTML="<div class='weather-icon'>"+info[1]+"</div><div><div class='hour-time'>"+formatHour(hour.time)+" · "+info[0]+"</div><div class='hour-detail'>Feels "+Math.round(hour.apparent_temperature)+"° · Rain "+hour.precipitation+" mm · Wind "+Math.round(hour.wind_speed)+" mph "+direction(hour.wind_direction)+"</div></div><div class='hour-temp'>"+Math.round(hour.temperature)+"°</div>";
forecast.appendChild(row);});}
function renderChart(){if(!currentForecast)return;const points=currentForecast.hourly.slice(0,24),ctx=document.getElementById("temperature-chart");if(temperatureChart)temperatureChart.destroy();
temperatureChart=new Chart(ctx,{type:"line",data:{labels:points.map(p=>formatHour(p.time)),datasets:[{label:"Temperature",data:points.map(p=>p.temperature),tension:.3,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>v+"°"}}}}});}
async function searchLocations(){
const input=document.getElementById("search-input"),results=document.getElementById("search-results"),query=input.value.trim();if(query.length<2)return;
results.style.display="block";results.innerHTML="<div class='search-result'>Searching...</div>";
try{const r=await fetch("/api/geocode/search?q="+encodeURIComponent(query));if(!r.ok)throw 0;const places=await r.json();results.innerHTML="";
if(!places.length){results.innerHTML="<div class='search-result'>No locations found.</div>";return;}
places.forEach(place=>{const item=document.createElement("div");item.className="search-result";item.textContent=place.display_name;item.addEventListener("click",()=>{const lat=Number(place.lat),lon=Number(place.lon),name=place.display_name.split(",").slice(0,2).join(",");map.setView([lat,lon],10);marker.setLatLng([lat,lon]);results.style.display="none";loadForecast(lat,lon,name);});results.appendChild(item);});}
catch{results.innerHTML="<div class='search-result'>Search unavailable.</div>";}}
async function toggleRadar(){
const credit=document.getElementById("radar-credit");if(radarLayer){map.removeLayer(radarLayer);radarLayer=null;credit.style.display="none";return;}
try{const r=await fetch("https://api.rainviewer.com/public/weather-maps.json");if(!r.ok)throw 0;const data=await r.json(),frames=data.radar&&data.radar.past;if(!frames||!frames.length)throw 0;
const frame=frames[frames.length-1],url=data.host+frame.path+"/256/{z}/{x}/{y}/2/1_1.png";
radarLayer=L.tileLayer(url,{opacity:.55,maxZoom:7,attribution:"Weather radar by RainViewer"}).addTo(map);credit.style.display="block";}catch{alert("Radar is currently unavailable.");}}
document.getElementById("search-button").addEventListener("click",searchLocations);
document.getElementById("search-input").addEventListener("keydown",e=>{if(e.key==="Enter")searchLocations();});
document.getElementById("locate-button").addEventListener("click",()=>{if(!navigator.geolocation){alert("Your browser does not provide location access.");return;}navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude,lon=p.coords.longitude;map.setView([lat,lon],10);marker.setLatLng([lat,lon]);loadForecast(lat,lon);},()=>alert("Unable to access your location."));});
document.getElementById("radar-button").addEventListener("click",toggleRadar);
document.getElementById("daily-tab").addEventListener("click",()=>{currentView="daily";document.getElementById("daily-tab").classList.add("active");document.getElementById("hourly-tab").classList.remove("active");renderForecast();});
document.getElementById("hourly-tab").addEventListener("click",()=>{currentView="hourly";document.getElementById("hourly-tab").classList.add("active");document.getElementById("daily-tab").classList.remove("active");renderForecast();});
map.on("click",e=>{const lat=e.latlng.lat,lon=e.latlng.lng;marker.setLatLng([lat,lon]);loadForecast(lat,lon);});
loadForecast(30.0799,-95.4172,"Spring, TX");
</script>
</body>
</html>
